version: '3.9'

services:
  # ─────────────────────────────────────────────────────
  # Redis — optional caching layer.
  # Backend has a built-in in-memory fallback, but a real
  # Redis makes token caching and rate limiting durable.
  # ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ws-otp-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - ws-otp-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # Backend — Node.js / Express + Socket.IO on port 3000
  # Database: PostgreSQL (Neon, external cloud)
  # ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ws-otp-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env          # loads NEON_DATABASE_URL, TELEGRAM_BOT_TOKEN, JWT_SECRET, etc.
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Point Redis to the redis service (overrides anything in .env)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Allow requests from the frontend container and any browser hitting port 5000
      ALLOWED_ORIGINS: "http://localhost:5000,http://127.0.0.1:5000"
      # Logging
      LOG_DIR: /app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ws-otp-net
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3

  # ─────────────────────────────────────────────────────
  # Frontend — Vite React build served by nginx
  # nginx also reverse-proxies /api and /socket.io
  # to the backend container on port 5000
  # ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ws-otp-frontend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ws-otp-net

networks:
  ws-otp-net:
    driver: bridge

volumes:
  redis_data:
  backend_logs:
